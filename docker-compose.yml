services:
  citysync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citysync-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - SIMULATION_AUTO_START=true
      - SIMULATION_INTERVAL_SECONDS=4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
